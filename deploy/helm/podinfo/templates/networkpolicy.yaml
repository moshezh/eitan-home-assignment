# Namespace is default-deny (Terraform). Only traefik may reach the app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-from-traefik
  labels:
    {{- include "podinfo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "podinfo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: http
